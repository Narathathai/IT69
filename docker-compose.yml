version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uni_it_postgres
    restart: always
    environment:
      POSTGRES_USER: uni_admin
      POSTGRES_PASSWORD: uni_secret_pass
      POSTGRES_DB: uni_it_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uni_admin -d uni_it_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uni_it_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
